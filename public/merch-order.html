<!doctype html>
<html lang="vi">
  <head><meta charset="utf-8" /><title>Merch order form registration</title></head>
  <body>
    <form name="merch-order" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="merch-order" />
      <input name="order_code" />
      <input name="product" />
      <input name="quantity" />
      <input name="unit_price" />
      <input name="total" />
      <input name="full_name" />
      <input name="phone" type="tel" />
      <input name="email" type="email" />
      <input name="delivery" />
      <textarea name="address"></textarea>
      <textarea name="note"></textarea>
      <input name="transfer_note" />
      <input name="bot-field" />
    </form>
  </body>
</html>
